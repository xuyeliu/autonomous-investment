<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Hedge Fund Manager — Demo</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #e5ddd5;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }

  .phone {
    width: 420px;
    max-width: 100vw;
    height: 90vh;
    max-height: 780px;
    background: #e5ddd5;
    border-radius: 24px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow: 0 8px 40px rgba(0,0,0,0.25);
  }

  /* Header */
  .header {
    background: #075e54;
    color: #fff;
    padding: 14px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
  }
  .header .avatar {
    width: 40px; height: 40px;
    border-radius: 50%;
    background: #128c7e;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; font-weight: 700;
  }
  .header .info h2 { font-size: 16px; font-weight: 600; }
  .header .info p { font-size: 11px; opacity: 0.8; }

  /* Chat area */
  .chat {
    flex: 1;
    overflow-y: auto;
    padding: 12px 16px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    background: url("data:image/svg+xml,%3Csvg width='200' height='200' xmlns='http://www.w3.org/2000/svg'%3E%3Cdefs%3E%3Cpattern id='p' width='40' height='40' patternUnits='userSpaceOnUse'%3E%3Ccircle cx='20' cy='20' r='1' fill='%23c8c0b8' opacity='0.3'/%3E%3C/pattern%3E%3C/defs%3E%3Crect width='200' height='200' fill='%23e5ddd5'/%3E%3Crect width='200' height='200' fill='url(%23p)'/%3E%3C/svg%3E");
  }

  .msg {
    max-width: 82%;
    padding: 8px 12px;
    border-radius: 8px;
    font-size: 14px;
    line-height: 1.45;
    white-space: pre-wrap;
    word-wrap: break-word;
    position: relative;
    margin-bottom: 2px;
  }
  .msg.bot {
    background: #fff;
    align-self: flex-start;
    border-top-left-radius: 0;
  }
  .msg.user {
    background: #dcf8c6;
    align-self: flex-end;
    border-top-right-radius: 0;
  }
  .msg .time {
    font-size: 10px;
    color: #999;
    float: right;
    margin-left: 8px;
    margin-top: 4px;
  }
  .msg b, .msg strong { font-weight: 600; }

  .typing {
    align-self: flex-start;
    background: #fff;
    padding: 10px 16px;
    border-radius: 8px;
    border-top-left-radius: 0;
    font-size: 13px;
    color: #999;
    display: none;
  }
  .typing.show { display: block; }

  /* Input bar */
  .input-bar {
    background: #f0f0f0;
    padding: 8px 12px;
    display: flex;
    gap: 8px;
    align-items: center;
    flex-shrink: 0;
  }
  .input-bar input {
    flex: 1;
    border: none;
    border-radius: 20px;
    padding: 10px 16px;
    font-size: 14px;
    background: #fff;
    outline: none;
  }
  .input-bar button {
    width: 40px; height: 40px;
    border-radius: 50%;
    border: none;
    background: #075e54;
    color: #fff;
    font-size: 18px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .input-bar button:hover { background: #128c7e; }

  /* Quick replies */
  .quick-bar {
    background: #f0f0f0;
    padding: 4px 12px 8px;
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    flex-shrink: 0;
  }
  .quick-bar button {
    border: 1px solid #075e54;
    background: #fff;
    color: #075e54;
    border-radius: 16px;
    padding: 5px 12px;
    font-size: 12px;
    cursor: pointer;
    white-space: nowrap;
  }
  .quick-bar button:hover { background: #075e54; color: #fff; }

  /* State indicator */
  .state-bar {
    background: #075e54;
    color: #ffffffcc;
    text-align: center;
    font-size: 11px;
    padding: 4px;
    flex-shrink: 0;
  }

  /* Scrollbar */
  .chat::-webkit-scrollbar { width: 4px; }
  .chat::-webkit-scrollbar-thumb { background: #c0b8af; border-radius: 4px; }
</style>
</head>
<body>

<div class="phone">
  <div class="header">
    <div class="avatar">AI</div>
    <div class="info">
      <h2>AI Hedge Fund Manager</h2>
      <p>online</p>
    </div>
  </div>

  <div class="state-bar" id="stateBar">State: new</div>

  <div class="chat" id="chat">
    <div class="typing" id="typing">typing...</div>
  </div>

  <div class="quick-bar" id="quickBar">
    <button onclick="send('hello')">hello</button>
    <button onclick="send('invest 1000')">invest 1000</button>
    <button onclick="send('help')">help</button>
  </div>

  <div class="input-bar">
    <input type="text" id="input" placeholder="Type a message..." autocomplete="off">
    <button onclick="sendInput()" aria-label="Send">&#9654;</button>
  </div>
</div>

<script>
const chatEl  = document.getElementById('chat');
const inputEl = document.getElementById('input');
const typingEl = document.getElementById('typing');
const stateBar = document.getElementById('stateBar');
const quickBar = document.getElementById('quickBar');

// Unique session per browser tab
const userId = 'demo_' + Math.random().toString(36).slice(2, 10);

function timeStr() {
  const d = new Date();
  return d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
}

function addMsg(text, cls) {
  const el = document.createElement('div');
  el.className = 'msg ' + cls;
  // Convert *bold* markers to <b> tags
  const escaped = text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const formatted = escaped.replace(/\*([^*]+)\*/g, '<b>$1</b>');
  el.innerHTML = formatted + '<span class="time">' + timeStr() + '</span>';
  chatEl.insertBefore(el, typingEl);
  chatEl.scrollTop = chatEl.scrollHeight;
}

function updateQuickButtons(state, reply) {
  const buttons = [];
  if (state === 'new' || state === 'withdrawn') {
    buttons.push(['hello', 'hello'], ['invest 1000', 'invest 1000'], ['help', 'help']);
  } else if (state === 'choosing') {
    for (let i = 1; i <= 5; i++) buttons.push([i.toString(), i.toString()]);
  } else if (state === 'active') {
    buttons.push(['status','status'], ['report','report'], ['why','why'],
                 ['details','details'], ['switch','switch'], ['withdraw','withdraw']);
  }
  quickBar.innerHTML = '';
  buttons.forEach(([label, cmd]) => {
    const b = document.createElement('button');
    b.textContent = label;
    b.onclick = () => send(cmd);
    quickBar.appendChild(b);
  });
}

async function send(text) {
  if (!text.trim()) return;
  addMsg(text, 'user');
  inputEl.value = '';
  typingEl.classList.add('show');

  try {
    const res = await fetch('/chat', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ user_id: userId, message: text })
    });
    const data = await res.json();
    typingEl.classList.remove('show');
    addMsg(data.reply, 'bot');

    // Fetch state for UI updates
    try {
      const sr = await fetch('/status/' + userId);
      const sd = await sr.json();
      stateBar.textContent = 'State: ' + sd.state +
        (sd.portfolio ? ' | ' + sd.portfolio : '') +
        (sd.current_value ? ' | Value: $' + sd.current_value.toFixed(2) : '');
      updateQuickButtons(sd.state, data.reply);
    } catch(e) {}

  } catch(err) {
    typingEl.classList.remove('show');
    addMsg('Error: could not reach server.', 'bot');
  }
}

function sendInput() {
  send(inputEl.value);
}

inputEl.addEventListener('keydown', e => {
  if (e.key === 'Enter') sendInput();
});

// Welcome on load
window.addEventListener('load', () => {
  addMsg('Welcome! This is a demo of the AI Hedge Fund Manager WhatsApp bot.\n\nTry sending *hello* or *invest 1000* to get started.', 'bot');
});
</script>

</body>
</html>
